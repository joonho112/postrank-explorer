project:
  type: website
  output-dir: docs
  # Only these sources are site pages; engine/, verification/, r-export/, notes/ and the Markdown guides are not.
  render:
    - index.qmd
    - catalog.qmd
    - "pages/**/*.qmd"
  # Copied into docs/ as they are: what pages and embeds load. A leading "/" anchors each glob at the project
  # root (so js/** cannot match engine/node_modules/*/js/).
  resources:
    - "/js/bundles/*.js"
    - "/js/site/*.js"
    - "/js/vendor/*.min.js"
    - "/js/vendor/*.LICENSE"
    - "/js/vendor/temml/temml.min.js"
    - "/js/vendor/temml/LICENSE"
    - "/styles/tokens.css"
    - "/styles/app.css"
    - "/styles/temml.css"
    - "/embed/*.html"
    - "/media/**"
  # The generator writes embeds, part cards, the catalog tables and the navbar from the catalog (a render of single
  # pages only rebuilds their apps); formulas are typeset to MathML after the render (no script, no network).
  pre-render: node scripts/build.mjs --pre-render
  post-render:
    - node scripts/post-render-math.mjs
    - node scripts/site-assets.mjs

# Navbar: written from catalog.json by scripts/build.mjs.
metadata-files:
  - _nav.yml

website:
  title: "postrank Explorer"
  description: "Methods and numerical illustrations for posterior ranking and ordered grade reporting."
  favicon: media/favicon.svg
  page-navigation: false
  page-footer:
    left: "postrank Explorer v3 · code MIT · text and figures CC BY 4.0 · data per file (notes/data-rights.md)"
    right: "Built on postrank 1.1.0"

format:
  html:
    theme: [cosmo, styles/site.scss]
    css:
      - styles/tokens.css
      - styles/app.css
    toc: false
    lang: en
    # Site pages are light: an OS in dark mode must not switch the token colours of cards and apps.
    include-in-header:
      text: '<script>document.documentElement.setAttribute("data-theme", "light");</script>'
    include-after-body: js/site/recipe-keyboard.html
    # Quarto keeps the TeX through this no-op stub; scripts/post-render-math.mjs replaces it with Temml MathML.
    html-math-method:
      method: mathjax
      url: /js/vendor/mathjax-stub.js
