<script>
(() => {
  // Full Quarto site pages are light-only so prose, tables, callouts, and cards remain legible regardless of OS dark mode.
  document.documentElement.setAttribute('data-theme', 'light');

  document.addEventListener('DOMContentLoaded', () => {
    // Retain the short page description above the app. On phones put the longer
    // interpretation beside the worked examples after it, preserving every link.
    const app = document.querySelector('main > #app');
    const lead = app?.previousElementSibling;
    if (lead?.matches('p') && document.querySelector('#title-block-header .description') && !lead.querySelector('nav')) {
      const marker = document.createComment('app introduction');
      lead.before(marker);
      const narrow = matchMedia('(max-width: 600px)');
      const place = () => { if (narrow.matches) app.after(lead); else marker.after(lead); };
      place();
      narrow.addEventListener('change', place);
    }
  }, {once: true});
})();
</script>
